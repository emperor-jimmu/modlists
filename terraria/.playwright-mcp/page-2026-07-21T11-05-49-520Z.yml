            - generic [ref=f2e188]: Description
            - generic [ref=f2e189]:
              - generic [ref=f2e191]: Recipe Browser!
              - text: Recipe Browser is an indispensable mod for any player. It provides a service to the user that the Guide could only dream of providing. With Recipe Browser, you have access to powerful tools to help you plan out what items you want to craft. You'll be able to quickly find items that you can craft with the items in your possession, even if it takes several intermediate crafting steps.
              - generic [ref=f2e193]: How to Use
              - text: To use, first you need to assign some hotkeys. Make sure to go into the Keybindings menu and assign hotkeys. The "Toggle Recipe Browser" hotkey is necessary, the other 2 are useful but somewhat optional. The "Query Hovered Item" hotkey streamlines checking recipes and the "Toggle Favorited Recipes Window" is useful when using the favorited recipes feature.
              - generic [ref=f2e195]: Basic Features
              - text: The main window consists of several tabs. You can click on the tabs to visit each tool. You can resize the window as well. The Help tab explains each tool in greater detail, be sure to check it out.
              - generic [ref=f2e197]: Recipes
              - text: This tool allows you to quickly explore all recipes in the game. You can place an item in the query slot to find recipes using or resulting in that item. You can also search and filter with the various options in the window to discover recipes you'd like to work towards. Crafting stations and recipe conditions for a selected recipe are listed at the bottom. The color will be red or green showing if the player is near one or not. The right side will show any NPC that drops the selected item. Double Click on an NPC to visit the Bestiary. Double Clicking on a Recipe or Ingredient will populate the query slot with the item, great for traversing crafting trees for items with multiple levels of crafting. Alt-click on a recipe to favorite a recipe, see Favorite section below.
              - generic [ref=f2e199]: Craft
              - text: This tool can be used to craft recipes, even recipes that require multiple steps to achieve! In the Recipes tool, right click on any recipe to bring up this tool. Recipes with the yellow background can be crafted via multiple steps. For example, if you have gold and iron ore and click on the Gold Watch recipe, this tool will show you the multiple steps needed to craft gold and iron ore, followed by crafting chains, and finally the gold watch itself. You can also enable the Loot option to allow farming as part of the multi-step process. Simply find and kill the specified enemies to farm the needed ingredient. By default, all crafting stations that you have seen will be available for the extended crafting paths. If you enable the Missing Stations option, unseen crafting stations will also be shown. See the Help tab for more information on this tool.
              - generic [ref=f2e201]: Items
              - text: Here you can explore all items in the game. Use the filters and sorts to find what you want. Double click an item to query it in the Recipe panel. Double right click an item to query the item in the Bestiary.
              - generic [ref=f2e202]: Bestiary
              - text: Here you can explore all NPC in the game. Use the filters to find what you want. Clicking on an NPC shows the loot from that NPC. Placing an item in the query slot filters the grid to show only NPC that drop that item. Double click an item to query it in the Recipe panel. Right click an item to populate the query slot, great for seeing who else drops the same item.
              - generic [ref=f2e203]: Favorite
              - text: In the Recipe panel, you can favorite recipes by alt-clicking on the recipe. If you have favorited recipes, the favorites panel will appear on screen. This panel will help you track progress towards collecting all ingredients. In multiplayer, recipes favorited by other players will also appear in the favorites panel. You can track the progress of other players and cooperate efficiently.
              - generic [ref=f2e206]: Query Hovered Item
              - text: By assigning a hotkey in the keybindings menu, you can use this feature to quickly bring the item into one of the tools. You can use it anytime you are hovering over any item anywhere in the game.
              - generic [ref=f2e208]: Categories, Sub Categories, Sorts, and Filters
              - text: There are powerful sorting and filtering options. You can search for specific weapon types, find the most powerful pickaxe you can craft, and more. See the Help tab for more information.
              - generic [ref=f2e210]: Armor Set
              - text: The Armor Set category lets you view armor sets. Plan out which armor set you want to work towards that fits your playstyle!
              - generic [ref=f2e212]: Help
              - text: There are many more features in Recipe Browser, see the Help tab to read and learn more about the features of this mod.
