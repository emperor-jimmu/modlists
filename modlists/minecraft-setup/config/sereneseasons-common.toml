[general]
	#Whether crops are affected by seasons.
	seasonal_crops = true
	#How crops behave when out of season.
	#0 = Grow slowly (temperature damage OFF — crops never break)
	#1 = Can't grow
	#2 = Break when trying to grow
	out_of_season_crop_behavior = 0
	#Maximum height level for out of season crops to have fertility underground.
	underground_fertility_level = 48
	#Whether to include tooltips on crops listing which seasons they're fertile in.
	crop_tooltips = true
	#Whether the season cycle progresses while no players are online (singleplayer: always progresses while game is open).
	progress_while_offline = true
