      - generic [ref=f1e130]:
        - generic [ref=f1e131]:
          - link "Steam Workshop browsing update available for all" [ref=f1e133] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/694261777025729019
          - generic [ref=f1e134]:
            - text: 27 May -
            - link "Alden" [ref=f1e135] [cursor=pointer]:
              - /url: https://steamcommunity.com/id/thealden
          - generic [ref=f1e136]:
            - paragraph [ref=f1e137]: The latest update to Steam Workshop has just wrapped up the beta test period and is now deployed for everyone.
            - paragraph [ref=f1e138]: Thank you to everyone who tried out the beta and gave us your feedback over the past seven-week beta period! We tried to keep up on reading all the feedback and incorporate as much as we could into our decision making. Along the way, you've probably noticed as we made quite a few updates big and small.
            - paragraph [ref=f1e139]: "Hopefully the end result is a Workshop that makes it easier to browse, search, and filter, in order to find great user-created mods to enhance your gaming experience. Please keep your feedback coming: We plan to continue improving the Steam Workshop, including updates to more pages."
            - paragraph
            - paragraph [ref=f1e140]:
              - text: Read the
              - link "full post on our Steam Blog" [ref=f1e141] [cursor=pointer]:
                - /url: https://store.steampowered.com/news/app/593110/view/704394876188360836
            - paragraph
            - paragraph [ref=f1e142]: "Here's a quick look at the updated features in action:"
            - paragraph [ref=f1e143]
          - link [ref=f1e146] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/694261777025729019
        - generic [ref=f1e149]:
          - link "New Beta For Steam Workshop Browsing" [ref=f1e151] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/518616498862818032
          - generic [ref=f1e152]:
            - text: 7 April -
            - link "Alden" [ref=f1e153] [cursor=pointer]:
              - /url: https://steamcommunity.com/id/alden
          - generic [ref=f1e154]:
            - paragraph [ref=f1e155]: Today we've updated the Steam Workshop to make the browsing experience quicker and easier to use. The new user interface is available as an opt-in beta, which you can enable by clicking on the "View Workshop Beta" on any Workshop browse page (the pages with grids of items to explore).
            - paragraph [ref=f1e156]
            - paragraph
            - generic [ref=f1e158]: What's new
            - paragraph [ref=f1e159]: This update is geared around making the browsing and filtering experience faster and easier to use.
            - list [ref=f1e160]:
              - listitem [ref=f1e161]:
                - paragraph [ref=f1e162]: Wider page & bigger items - This update makes the browsing page wider, allowing for more items and bigger preview images of each item.
              - listitem [ref=f1e163]:
                - paragraph [ref=f1e164]: Faster filtering - We've completely rewritten the page, making it update more quickly when applying filters or changing sort orders.
              - listitem [ref=f1e165]:
                - paragraph [ref=f1e166]: Smarter filtering per-section - Filters can now be configured by game developers to apply (and appear) for certain types of items. For Workshops that contain both Maps and Items, developers can define which types each filter should apply to.
              - listitem [ref=f1e167]:
                - paragraph [ref=f1e168]: New Quick View - Click the little magnifying glass icon in the corner of each item to enter a quick view mode. Explore some screenshots, click to favorite, subscribe, or vote, all without leaving the browsing experience.
              - listitem [ref=f1e169]:
                - paragraph [ref=f1e170]: Mobile and Steam Deck friendly - This new rewrite of the page allows us to better manage the responsiveness of the page for different contexts such as mobile, Steam Deck, and Big Picture mode.
            - paragraph [ref=f1e171]
            - paragraph
            - generic [ref=f1e173]: "Workshop: Used by over 3,000 games and Millions of users"
            - paragraph [ref=f1e174]: "The Steam Workshop remains a heavily used part of the Steam Community: to date, there are over 3,000 games with Workshop enabled with a combined total of over 50 million items uploaded. Millions of players regularly subscribe to and vote on items. While we've added features and updated the Workshop over the years, we felt it was time to make some bigger improvements to the overall user experience. Through that lens, the Browse page was at the top of the list. Millions of users browse the Steam Workshop every month, and there are dozens of ways to interact with the user interface while doing it. Unfortunately, most interactions with the page required a full page reload, which significantly slowed down the browsing process."
            - paragraph [ref=f1e175]
            - paragraph
            - paragraph
            - generic [ref=f1e177]: Frequently Asked Questions
            - paragraph [ref=f1e178]: Q. How long will this be in beta?
            - paragraph [ref=f1e179]: A. We're aiming to run this update as a beta for a few weeks or months as we sort out the bugs and respond to your feedback. This browse page was used in a lot of different ways across all the games that support Workshop, and we want to make sure it can handle all of these use cases.
            - paragraph
            - paragraph [ref=f1e180]: Q. How do I give feedback on the changes?
            - paragraph [ref=f1e181]: A. Leave us a comment by clicking the 'Discuss' button below.
            - paragraph
            - paragraph [ref=f1e182]: Q. Do you plan to update other pages in the Workshop?
            - paragraph [ref=f1e183]: A. Yes, but we don't have an exact timeline for when. Once we wrap up this beta of the browsing page, we'll have a better idea of scope of work for subsequent pages.
          - link [ref=f1e185] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/518616498862818032
        - generic [ref=f1e188]:
          - link "Steam Workshop items can now specify supported game versions" [ref=f1e190] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/521953615223457012
          - generic [ref=f1e191]:
            - text: 8 January -
            - link "Alden" [ref=f1e192] [cursor=pointer]:
              - /url: https://steamcommunity.com/id/thealden
          - generic [ref=f1e193]:
            - paragraph [ref=f1e194]
            - paragraph [ref=f1e196]: With today's Steam update, items in the Steam Workshop can now contain data about compatibility with past versions of the game. Once this feature is enabled by the game's developer, mod authors can specify the versions of a game that are known to work for current and historical versions of a Workshop item.
            - paragraph [ref=f1e197]:
              - text: This update to the Steam Workshop is designed to work in conjunction with a set of Steam APIs that game developers can use to manage historical versions of their game. For more information for game developers on game version management, please see our post
              - link "New! Version Control For Steam Workshop Mods" [ref=f1e198] [cursor=pointer]:
                - /url: https://store.steampowered.com/news/group/4145017/view/497183817277113900
              - text: .
            - paragraph [ref=f1e199]: "There are three main components of this update to Workshop:"
            - list [ref=f1e200]:
              - listitem [ref=f1e201]:
                - paragraph [ref=f1e202]: Deliberate configuration by the game developer. First, it is important that the developer of the game is deliberate about their use of build branches and preserving past versions of the game. To do this, the game developer should keep past builds of the game as well-named branches and put them in a deliberate order. The developer should then also enable "Game Branch Versions" in the Workshop settings for the game. You'll know this is enabled when you see it listed as a feature in the workshop info.
              - listitem [ref=f1e204]:
                - paragraph [ref=f1e205]: Uploading multiple simultaneous mod versions of the same item. Steam Workshop mods have long supported version history, allowing authors to roll a mod back to a previously uploaded version if they need to. This new update allows the notion of two or more versions of an item being made accessible to players simultaneously.
              - listitem [ref=f1e206]:
                - paragraph [ref=f1e207]: Specifying the range of game versions that each mod version supports. In order to support multiple versions being accessible to players, Workshop item versions can now specify a range of one or more game builds that the mod author knows is supported by the mod. If no range is specified, Steam will assume the version works with any build of the game. If more than one version of the Workshop item are indicated as compatible with the player's current version of the game, then the latest uploaded version of the item will be the one that Steam downloads.
            - paragraph [ref=f1e208]: We know that many mod authors will not have the time to check whether their mod supports the latest version of a game. So we built this system to support ranges that include or exclude future updates. If the mod item is generally a simple item and likely to work with new versions of the game, then it may make sense to leave the supported range open-ended. However, if the mod is complex and the mod author wishes to test their mod with new game versions before declaring support, that can be easily done when configuring the supported ranges.
            - paragraph
            - paragraph [ref=f1e209]: These settings can be viewed and configured under the 'Change Notes' tab for a Workshop item.
            - paragraph [ref=f1e210]
            - paragraph
            - paragraph [ref=f1e212]: "Note: Game developers can also configure their Workshop uploader tool to set supported versions when uploading or updating a Workshop item."
            - paragraph
            - paragraph
            - generic [ref=f1e213]: Frequently Asked Questions
            - paragraph [ref=f1e214]: Q. I don't see the option to specify supported game versions for my Workshop creation.
            - paragraph [ref=f1e215]: A. Make sure the developer of the game has set "Enable Game Branch Versions" in their Steamworks settings for the game. This is a signal that the developer has been deliberate in the ordering of their game versions.
            - paragraph [ref=f1e216]: Look for this icon under the 'Enabled Features' within the game's Steam Workshop 'About' page.
            - paragraph [ref=f1e217]
          - link [ref=f1e220] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/521953615223457012
        - generic [ref=f1e223]:
          - link "Your Subscriptions and Workshop Collections" [ref=f1e225] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/3889485345756435017
          - generic [ref=f1e226]:
            - text: 18 December, 2023 -
            - link "TomB" [ref=f1e227] [cursor=pointer]:
              - /url: https://steamcommunity.com/id/tomqbui
          - generic [ref=f1e228]:
            - text: Based on your feedback from the recent Steam Workshop changes outlined
            - link "here" [ref=f1e229] [cursor=pointer]:
              - /url: https://store.steampowered.com/news/app/766/view/3888358641555807824
            - text: ", we've added some additional features around Workshop subscriptions: you can now easily create, save, and load different subscription lists using Workshop Collections. This will make it easier to create \"presets\" or \"mod lists\" that you can swap between for whatever reason. In the"
            - generic [ref=f1e230]:
              - text: Steam Client (
              - link "beta" [ref=f1e231] [cursor=pointer]:
                - /url: https://help.steampowered.com/en/faqs/view/276C-85A0-C531-AFA3
              - text: )
            - text: ", you can access your Workshop Collections on your game's Properties > Workshop page under Advanced Options. From here you can quickly save your subscriptions list to a collection, or update your subscriptions list from a collection. The load order for your items will match the order of subscriptions within the collection. We've also made it easier to share the mods you are using with your friends - Workshop Collections can now be shared via a link from within the Steam Client. (note that you'll need to save your subscriptions to a collection before you can send a link to a friend).On the Steam Community, the \"Save to Collection\" button is accessible on your subscriptions page for a game. On a collection's web page, the \"Subscribe to all\" button will now give you a choice of adding to or overwriting your current subscription list. There’s also an option to save a collection’s contents to another collection. There have also been some small updates to the Collection editor itself to make managing items a bit easier."
            - list [ref=f1e233]:
              - listitem [ref=f1e234]: Added the ability to sort items by Time Created or Time Updated
              - listitem [ref=f1e235]: Added the ability to sort items in ascending or descending order
              - listitem [ref=f1e236]: Added the ability to add or remove all items from the selected section (e.g. item's you've published, favorited, or subscribed to)
              - listitem [ref=f1e237]: Added ability to quickly remove all items or linked collections
          - link [ref=f1e239] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/3889485345756435017
        - generic [ref=f1e242]:
          - link "New Quality of Life Workshop Features" [ref=f1e244] [cursor=pointer]:
            - /url: https://steamcommunity.com/games/SteamWorkshop/announcements/detail/3888358641555807825
          - generic [ref=f1e245]:
            - text: 12 December, 2023 -
            - link "TomB (Valve)" [ref=f1e246] [cursor=pointer]:
              - /url: https://steamcommunity.com/profiles/76561198050431321
          - generic [ref=f1e247]:
            - text: We've recently added some features to the Workshop that should be pretty useful for both new and power users alike.The new Steam Client beta has various improvements around Workshop, including displaying which item is being downloaded in the Downloads page, and an improved interface for dealing with your Workshop item subscriptions (accessible from your game's Properties dialog). The subscription list now contains additional information, such as when the item was last updated, when you subscribed to it, and any item dependencies. You can also filter your list by name or by tag.For more advanced use cases, you can disable items from being loaded by your game. And you can now change the local load order for your items. Also, if Workshop creators have set their items as depending on other items, you can automatically set the load order based on these dependencies. Missing dependencies will also be displayed, to make it easier to see why some mods are not working. You can opt into the
            - link "Steam Client beta" [ref=f1e249] [cursor=pointer]:
              - /url: https://help.steampowered.com/en/faqs/view/276C-85A0-C531-AFA3
            - text: "to try out these changes.On the web side of things, we've added Saved Search Queries. Basically, if you often find yourself searching/sorting/filtering to find the same kind of items in a game's Workshop, you can now save those search query parameters. Then you can re-run your search at any time by selecting that saved search query from your game's Workshop home page. We've also added some more browsing options to the main Workshop Home page. You can now filter to games that have Workshops based on whether you recently visited them, and we've brought back the ability to view Workshops for games you own or have recent playtime in.Plus a few other web changes:"
            - list [ref=f1e251]:
              - listitem [ref=f1e252]: Added the ability to subscribe to an item and all the items it depends on
              - listitem [ref=f1e253]: Added previous and next buttons to the image viewer
              - listitem [ref=f1e254]: Adding an item to a collection no longer reloads the web page
              - listitem [ref=f1e255]: Allow unlisted and friends-only items to be added to a collection
            - text: Let us know your thoughts in the Steam Client Beta
            - link "discussions" [ref=f1e256] [cursor=pointer]:
              - /url: https://steamcommunity.com/groups/SteamClientBeta/discussions
            - text: .
          - link [ref=f1e258] [cursor=pointer]:
