      - generic [ref=f1e96]:
        - heading "Bale Autoload Pack" [level=2] [ref=f1e97]
        - generic [ref=f1e98]: "The Bale Autoload Pack includes: Kroeger PWO 24 Bale Autoload Price: from $25,500 Category: Bale loaders, Flatbed trailers * Configuration: Standard or Bale Autoload * Configuration: Extension * Configuration: Beacon * Autoload for - round bales (125cm: 26 bales, 150cm: 22 bales, 180cm: 18 bales, cotton: 4 bales) - square bales (120cm: 238 bales, 180cm: 30 bales, 220cm & 240cm: 24 bales, cotton: 2 bales) * each side of the body can be opened separately or both sides at the same time (\"U\" key to select the loading side, \"Y\" key to open/close) * Color choice for trailer & rims * Choice of tyres (Continental, Trelleborg, BKT, Vredestein) * New rear lights with reverse lights Farmtech DPW 1800 Bale Autoload Price: from $20,500 Category: Bale loaders, Flatbed trailers * Configuration: Standard or Bale Autoload * Configuration: Extension * Configuration: Beacon * Autoload for - round bales (125cm: 26 bales, 150cm: 22 bales, 180cm: 18 bales, cotton: 4 bales) - square bales (120cm: 317 bales, 180cm: 30 bales, 220cm & 240cm: 24 bales, cotton: 2 bales) * Rim color option * Choice of tyres (Continental, Trelleborg, BKT, Vredestein) * New rear lights with reverse lights Farmtech DDK 2400 Bale Autoload Price: from $30,500 Category: Trailers, Bale loaders, Flatbed trailers * Configuration: Bales, Bale Autoload, 14m³, 28m³ * Autoload for - round bales (125cm: 22 bales, 150cm: 18 bales, 180cm: 14 bales, cotton: 3 bales) - square bales (120cm: 246 bales, 180cm: 24 bales, 220cm & 240cm: 18 bales, cotton: 1 bale) * Rim color option * Choice of tyres (Continental, Trelleborg, BKT, Vredestein) * New rear lights with reverse lights * Configuration for trailer hitch Farmtech EDK 650 Bale Autoload Price: from $6,000 Category: Trailers, Bale loaders, Flatbed trailers * Configuration: Bales, Bale Autoload, 4m³, 8m³ * Autoload for - round bales (125cm: 10 bales, 150cm & 180cm: 6 bales) - square bales (120cm: 120 bales, 180cm: 12 bales, 220cm & 240cm: 9 bales) * Rim color option How Bale Autoload works: Important notes: - Bale Autoload is only available when configured in the workshop/garage. 1. Move the trailer into working position with \"B\". Bales can now be collected. - In \"EASY\" working mode, the trailer automatically collects bales located up to 4m beside the trailer. - In \"PRO\" working mode, the bales must be placed on the trailer to be detected by Autoload. The working mode can be changed at any time with \"Ctrl\"+\"Z\". 2. After collecting the bales, move the trailer into transport position with \"B\". 3. To unload, start unloading mode with \"Z\". The unloading assistant controls are available during the unloading process. The bales can be moved in all directions and rotated on all axes. Select the unloading position and unload the bales with \"Z\". After unloading, end the unloading process with \"Z\". The unloading process can be cancelled with \"X\". Changelog 1.2.0.0 - Fixed synchronization and unloading issues on dedicated servers - Restacked HD bales on PWO and DPW - Unloading helper controls are now available during the unloading process - Updated the explanation of how Bale Autoload works - Added DDK 2400 trailer hitch configuration Changelog 1.1.0.0 - Optimized bale positions - Added support for various mod bales (square bales: Hesston 240, 180x70, 220x70, 240x70; round bales: 085) - Restacked HD bales on the EDK 650 & DDK 2400 - Various minor adjustments"
