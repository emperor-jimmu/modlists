            - heading [level=2] [ref=f11e424]:
              - text: Setting
              - link "Sign in to edit" [ref=f11e426] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Ftotalwar.fandom.com%2Fwiki%2FTotal_War%3A_Shogun_2%3Fveaction%3Dedit%26section%3D1&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f11e429]:
              - text: Shogun 2 is set in the
              - link "Sengoku jidai" [ref=f11e430] [cursor=pointer]:
                - /url: http://en.wikipedia.org/wiki/Sengoku_Period
              - text: ", \"the Warring States Period\" (16th-century feudal Japan), in the aftermath of the"
              - link "Onin War" [ref=f11e431] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/%C5%8Cnin_War
              - text: . The country is fractured into rival clans led by local warlords, each fighting for control. The player takes on the role of one of these warlords, with the goal of dominating other factions and claiming his rule over Japan. The base game features a total of nine playable factions, each with a unique starting position and different political and military strengths. There are also many non-playable factions in the game.
            - paragraph [ref=f11e432]:
              - text: Moving away from the European setting of other Total War games, and returning to the setting in the
              - link "first Total War title" [ref=f11e433] [cursor=pointer]:
                - /url: /wiki/Shogun:_Total_War
              - text: the developers are making significant changes to core gameplay elements of Shogun 2. For example, to reflect the characteristics of East Asian warfare, the game's AI is designed on the principles of Sun Tzu's
              - link "The Art of War" [ref=f11e434] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/The_Art_of_War
              - text: . Compared to Empire which spanned the entire globe, the new installment is set to focus on the islands of
              - link "Japan" [ref=f11e435] [cursor=pointer]:
                - /url: /wiki/Japan
              - text: and on a reduced number of unit types.
            - heading [level=2] [ref=f11e436]:
              - text: Gameplay
              - link "Sign in to edit" [ref=f11e438] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Ftotalwar.fandom.com%2Fwiki%2FTotal_War%3A_Shogun_2%3Fveaction%3Dedit%26section%3D2&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f11e441]: Shogun 2 has a combination of real-time strategy and turn-based strategy gameplay, a staple of the Total War series. The player plays the role of both the clan leader and general, alternating between the "campaign", where the player manages his land and armies turn by turn, and the "battles", where the player takes control of the army on the battlefield in real-time.
            - paragraph [ref=f11e442]:
              - text: In the "campaign", the player oversees the development of
              - link "settlements" [ref=f11e443] [cursor=pointer]:
                - /url: /wiki/Category:Total_War:_Shogun_2_buildings
              - text: ","
              - link "military production" [ref=f11e444] [cursor=pointer]:
                - /url: /wiki/Category:Total_War:_Shogun_2_units
              - text: ","
              - link "economic growth" [ref=f11e445] [cursor=pointer]:
                - /url: /wiki/Trade#Total_War:_Shogun_2
              - text: ", and"
              - link "technological advancement" [ref=f11e446] [cursor=pointer]:
                - /url: /wiki/Arts
              - text: . The armies and units are organized and moved around the stylized campaign map by the player to carry out battles with other factions. In addition to fighting, the player are able to engage in diplomacy, political maneuvering, and special
              - link "agents" [ref=f11e447] [cursor=pointer]:
                - /url: /wiki/Agents_(Total_War:_Shogun_2)
              - text: to gain the upper hand.
            - paragraph [ref=f11e448]:
              - text: In Shogun 2, leaders and
              - link "generals" [ref=f11e449] [cursor=pointer]:
                - /url: /wiki/General_(Total_War:_Shogun_2)
              - text: are given more personality and depth in gameplay, in an RPG-like fashion. Generals and agents are to be portrayed as "larger-than-life" heroes with unique characteristics and powerful abilities. The player is able to improve and unlock skills, traits and special abilities for the characters as they gain experience. The player can also engage in family politics within the clan, to keep its members loyal.
            - paragraph [ref=f11e450]: The "battles" of Shogun 2 involve large-scale skirmishes between armies that meet on the campaign map, taking place on land or on water. The game engine can reportedly support up to 56,000 soldiers in a single battle. The developers paid particular attention to re-designing the naval and siege battles appropriate to the new setting. In contrast to European castles and forts, the castles in feudal Japan had multiple tiers, and thus the siege battles in the game are put less focus on wall defenses but more on courtyard brawls and tactical maneuvering. Players fight naval battles with unique Japanese ships resembling "floating castles", and take into consideration melees on ships, arrow fire, coastal terrain, and many factors.
            - paragraph [ref=f11e451]: Shogun 2 features multiplayer battles as well as multiplayer campaigns that may involve more than 2 players. In a multiplayer campaign, players can be grouped into different clans, so that for each clan, one player assumes the role of clan leader and others take command of armies. The clan leaders have the ability to direct other players and assign rewards based on loyalty and performance, introducing clan politics into multiplayer. As a player's army invades an enemy territory or is attacked by enemy armies, the online matchmaker finds a suitable opponent and initiates a multiplayer battle. When a player defeats enemy armies and conquers territories, the player gains points and other bonuses for the clan. In addition, an achievement system is designed to provide adhering players with unique abilities and cosmetic upgrades.
            - heading [level=2] [ref=f11e453]:
