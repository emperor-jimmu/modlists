            - paragraph [ref=f11e543]:
              - text: The game includes
              - link "65 provinces" [ref=f11e544] [cursor=pointer]:
                - /url: /wiki/List_of_Provinces_in_Total_War:_Shogun_2
              - text: ", several"
              - link "trade nodes" [ref=f11e545] [cursor=pointer]:
                - /url: /wiki/Trade_Node
              - text: and 14 naval regions.
            - heading [level=2] [ref=f11e546]:
              - text: Features
              - link "Sign in to edit" [ref=f11e548] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Ftotalwar.fandom.com%2Fwiki%2FTotal_War%3A_Shogun_2%3Fveaction%3Dedit%26section%3D5&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f11e551]: "As a sequel to the Total War games, Shogun 2 has a number of new features:"
            - list [ref=f11e552]:
              - listitem [ref=f11e553]: Sieges - A revamp to the siege system means that now the attacker, for every level of castle upgrade (Now up to level 5), must attack levels of a city.
              - listitem [ref=f11e554]: "Seasons - Battles now have all 4 of the seasons: Spring, Summer, Autumn and Winter, each with their respective weather patterns."
              - listitem [ref=f11e555]: Heroes and Battlefield Duels - Hero units are now even better, rather than being mere icons and knight figures Heroes can now engage in 1 v 1 duels with other Daisho.
              - listitem [ref=f11e556]:
                - text: Battlefield Monuments - Battlefield now have special monuments; shrines and temples now have an active effect on
                - link "Morale" [ref=f11e557] [cursor=pointer]:
                  - /url: /wiki/Morale
                - text: and strength of some related Units.
              - listitem [ref=f11e558]: Unit Upgrades - With the number of available units consolidated Shogun 2 allows factions to upgrade and customize units the way they wish, customization does not only affect gameplay but also affect the aesthetic appearance of your units.
              - listitem [ref=f11e559]:
                - text: Upgrade Trees - The old 'tech' system has been replaced with a new one. Your clan may learn the
                - link "arts" [ref=f11e560] [cursor=pointer]:
                  - /url: /wiki/Arts
                - text: of Chi and
                - link "Bushido" [ref=f11e561] [cursor=pointer]:
                  - /url: /wiki/Bushido
                - text: ", Enlightenment and Warrior Arts."
              - listitem [ref=f11e562]: Royal Family - Family and Monarchs make a return. In this game, clans can split apart and engage in civil war, dealings with your own family members is now just as important as your dealings with other clans.
              - listitem [ref=f11e563]: Drop In - Players have the option to play drop in campaigns. Players can 'drop in' and fight real time battles, in place of the AI, against you.
              - listitem [ref=f11e564]: Difficulty and AI - Shogun 2 has introduced a whole new difficulty level for the hardcore gamer. AI is all spears
              - listitem [ref=f11e565]: Graphics and Drivers - Shogun 2 has an independent and completely new coding system, this improves graphics and memory but also introduces a whole world of mod capabilities.
            - heading [level=2] [ref=f11e567]:
              - text: Retail versions
              - link "Sign in to edit" [ref=f11e569] [cursor=pointer]:
                - /url: https://auth.fandom.com/signin?redirect=https%3A%2F%2Ftotalwar.fandom.com%2Fwiki%2FTotal_War%3A_Shogun_2%3Fveaction%3Dedit%26section%3D6&uselang=en&metadata=article-registration-edit-article-section
            - paragraph [ref=f11e572]:
              - text: "Shogun 2 is scheduled to be released in three different editions: the \"Standard Edition\" with just the game, a \"Limited Edition\" that includes a unique playable faction (the Hattori Clan), an additional historical battle scenario 'Nagashino', a complete set of armor for the player's online avatar and a starting bank of experience points to spend on that online character. The \"Grand Master's Edition\" includes the Limited Edition content as well as a replica bamboo box containing a Shogun 2 art book, a Shogun 2 themed Chess set and a detailed figurine of"
              - link "Takeda Shingen" [ref=f11e573] [cursor=pointer]:
                - /url: http://en.wikipedia.org/wiki/Takeda_Shingen
              - text: .
