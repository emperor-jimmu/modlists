            - list [ref=f11e623]:
              - listitem [ref=f11e624]:
                - text: The aide-de-camp's memetically-famous declaration of "Shameful display!" is frequently written out as an
                - generic "In reality, the enunciation of the Ls in the phrase are perfectly coherent though the statement remains clearly accented." [ref=f11e625]: Engrish
                - text: "-affected version \"Shamefur dispray!\""
                - list [ref=f11e626]:
                  - listitem [ref=f11e627]:
                    - text: "The voice actor for Total War: Shogun 2's aide-de-camp, Dai Tabuchi (credited as Dait Abuchi), probably knows how popular the \"Our men are running from the battlefield! Shameful display!\" voice line is since he has a voice demo just consisting of the line."
                    - superscript [ref=f11e628]:
                      - link "Reference 4" [ref=f11e629] [cursor=pointer]:
                        - /url: "#cite_note-4"
                        - text: "[4]"
                    - superscript [ref=f11e630]:
                      - link "Reference 5" [ref=f11e631] [cursor=pointer]:
                        - /url: "#cite_note-5"
                        - text: "[5]"
                    - superscript [ref=f11e632]:
                      - link "Reference 6" [ref=f11e633] [cursor=pointer]:
                        - /url: "#cite_note-6"
                        - text: "[6]"
              - listitem [ref=f11e634]:
                - text: This is the first game to have a Mature-rated blood pack.
                - superscript [ref=f11e635]:
                  - link "Reference 7" [ref=f11e636] [cursor=pointer]:
                    - /url: "#cite_note-7"
                    - text: "[7]"
              - listitem [ref=f11e637]:
                - text: For a long time, it was a common frustration among fans that even games set in Japan lacked official Japanese localisation. This trend appears to have shifted with the latest entry in the franchise.
