        - heading "Introduction" [level=3] [ref=f182e31]
        - paragraph [ref=f182e32]: "Total War: Shogun 2 is a game of two halves: strategic play - such as recruitment, construction and the conquest of provinces - occurs on the campaign map; tactical play - individual battles fought in 3D against a real or AI opponent - occurs on the battlefield."
        - heading "Becoming Shogun" [level=3] [ref=f182e33]
        - paragraph [ref=f182e34]: The principle object of the single player campaign game (along with fulfilment of your victory conditions) is for your daimyo to become shogun - the military ruler of all Japan. If your daimyo is to become shogun you must first defeat the current shogunate, the Ashikaga clan, capturing and holding the capital, Kyoto, for four seasons. At this point the emperor will declare your daimyo shogun. You can make a bid for the shogunate at any time, although the current incumbent may pre-emptively attack you if you become too powerful and famous amongst the other clans. War with the shogun for either reason may result in other clans declaring war on your own in support of the status quo; this stage is known as the "realm divide".
        - heading "Being Shogun" [level=3] [ref=f182e35]
        - paragraph [ref=f182e36]: Once the emperor has declared your daimyo shogun, you will be awarded a unit of shogun cavalry in Yamashiro province and the flagship "Nihon Maru" in the Eastern Seto Inland Sea. Additionally, your seasonal tax income will increase and your armed forces will receive a morale bonus.
        - heading "Selecting a Clan" [level=3] [ref=f182e37]
        - paragraph [ref=f182e38]: Each campaign begins following the selection of a clan. Each one has a unique start position and different strategic advantages.
        - heading "Navigating the Campaign Map" [level=3] [ref=f182e39]
        - paragraph [ref=f182e40]: Once you have reached the campaign map you can explore the environment by use of these keyboard and mouse controls. Drag the mouse to the edge of the screen to pull the campaign map or battlefield in that direction. Use W to move the camera forward and S to move it backward. A and D strafe sideways. Use X and Z or the mouse wheel to move in closer to the action. Use Q and E to rotate the map to the left or right.
        - paragraph [ref=f182e41]
        - heading "Extensions" [level=3] [ref=f182e42]
        - heading "Fall of the Samurai" [level=4] [ref=f182e43]
        - paragraph [ref=f182e44]: In the Fall of the Samurai extension, the campaign goal is somewhat different than in the original game. At Realm Divide, the player gets to choose whether to keep fighting for the side he is on (Imperial or Shogunate), uniting the factions of that under his command - or go independent, forming a Republic with everyone against him. To win, he still needs a minimum number of provinces including Kyoto, but also Edo (in the Musashi province); however, those can be held by any clan on his side. Except when he is independent - then he is on his own...
