          - generic [ref=f5e187]:
            - generic [ref=f5e188]: Description
            - generic [ref=f5e189]:
              - generic [ref=f5e190]: Calamity Mod
              - link "Discord" [ref=f5e191] [cursor=pointer]:
                - /url: https://steamcommunity.com/linkfilter/?u=https%3A%2F%2Fdiscord.gg%2Fcalamity
              - text: "[discord.gg]"
              - link "Official Wiki" [ref=f5e192] [cursor=pointer]:
                - /url: https://steamcommunity.com/linkfilter/?u=https%3A%2F%2Fcalamitymod.wiki.gg
              - text: "[calamitymod.wiki.gg]The Calamity Mod is a vast content mod that creates a new and refreshing experience for Terraria!With this mod comes a slew of new bosses, unique and challenging difficulty modes, over two thousand new items, new NPCs, and entire new biomes to explore! Calamity also massively expands the endgame of Terraria, creating an entirely original, intense experience for players to enjoy.The mod additionally tweaks tons of vanilla features whilst adding new ones to aid the player's experience and heavily expand on the base game, including but not limited to:"
              - list [ref=f5e193]:
                - listitem [ref=f5e194]: Reworked reforging with the Goblin Tinkerer
                - listitem [ref=f5e195]: Reworked gameplay progression in early Hardmode
                - listitem [ref=f5e196]: Dozens of extra crafting recipes for existing vanilla items
                - listitem [ref=f5e197]: Dozens more quality of life and balance changes!
              - generic [ref=f5e198]: Please note that this mod REQUIRES Calamity's soundtrack! You will need to download the music mod to be able to play!
              - link "https://steamcommunity.com/sharedfiles/filedetails/?id=2824688266" [ref=f5e199] [cursor=pointer]:
                - /url: https://steamcommunity.com/sharedfiles/filedetails/?id=2824688266
              - text: For even more Calamity music, subscribe to Vanilla Calamity Mod Music!
              - link "https://steamcommunity.com/sharedfiles/filedetails/?id=2816188633" [ref=f5e200] [cursor=pointer]:
                - /url: https://steamcommunity.com/sharedfiles/filedetails/?id=2816188633
              - text: Be sure to join our Discord server linked above to keep up with the latest news about upcoming updates and features.
              - separator [ref=f5e201]
              - text: "A more detailed breakdown of the content available in Calamity:"
              - list [ref=f5e202]:
                - listitem [ref=f5e203]: 27 bosses and 5 minibosses
                - listitem [ref=f5e204]: 200+ enemies
                - listitem [ref=f5e205]: 4 town NPCs
                - listitem [ref=f5e206]: 5 biomes and many new structures
                - listitem [ref=f5e207]: 1 event
                - listitem [ref=f5e208]: 1 new playable class (based on Throwing from Terraria 1.3)
                - listitem [ref=f5e209]: 2400+ items
                - listitem [ref=f5e210]: 700+ weapons
                - listitem [ref=f5e211]: Almost 100 blocks
                - listitem [ref=f5e212]: 600+ pieces of furniture
                - listitem [ref=f5e213]: 11 ores
                - listitem [ref=f5e214]: 2 full difficulty settings above Expert which can be combined with Master
                - listitem [ref=f5e215]: Significant improvements and changes to Master difficulty
                - listitem [ref=f5e216]: 50+ changes to vanilla mechanics
                - listitem [ref=f5e217]: 30+ new recipes for vanilla items
                - listitem [ref=f5e218]: 500+ tweaks and improvements to vanilla items
                - listitem [ref=f5e219]: Minor cross-mod support for the Thorium Mod
              - blockquote [ref=f5e220]:
                - generic [ref=f5e221]: "Originally posted by tModLoader CalamityMod:"
                - text: Developed By The Calamity Dev Team