              - generic [ref=f13e152]: 13 items
          - generic [ref=f13e153]:
            - generic [ref=f13e154]: Description
            - generic [ref=f13e155]:
              - text: A collection of bugfixes I've started offloading in to a standalone mod. All the fixes in this mod are original code I've written. Will keep adding as I fix things, and removing if/when PDX incorporates in to vanilla.
              - generic [ref=f13e156]: "Current bugs fixed:"
              - list [ref=f13e157]:
                - listitem [ref=f13e158]: Artillery Combat Computer (*new) - Not a true fix, but does effectively patch the majority of the weirdness with artillery combat computers. A long-standing bug has been causing ships to rush in to close range before backing off to a more appropriate distance.
                - listitem [ref=f13e159]: Land Appropriation - If you're invading planets with an army as a gestalt (or as a normal empire with the Land Appropriation policy turned on) the event which resettles pops to the conquered planet has multiple problems. The biggest problem is that it doesn't check how many pops are left on the planet its resettling from, which results in colonies being removed entirely.
                - listitem [ref=f13e160]: Grave Guardians - When this fleet is spawned by the Lone Object Astral Rift it starts a first contact event that can't be completed, and loops infinitely. The fix gives you instant comms with that country as soon as you assign an envoy. - fixed in vanilla
              - generic [ref=f13e161]: "Load Order:"
              - text: Put this towards the TOP of your mod list. If you have other mods that affect ship combat computers, make sure they load after this so that they can overwrite my changes to that.
