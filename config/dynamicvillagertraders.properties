# Dynamic Villager Trades Configuration
# Lower values make villagers settle on specific trades faster
global_randomness = 0.7
# Number of restocks between trade changes (1 = changes every other restock)
refresh_delay = 1
# Prevents librarians from selling the same enchant at different levels simultaneously
no_book_duplicates = true
# Adds Curse of Vanishing to every book sold by librarians (for Enchant & Repair compat)
enchant_repair_compat = false
