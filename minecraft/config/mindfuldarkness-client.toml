# Mindful Darkness — tracked override (user-tuned, Aug 2026)
# Values chosen by the user; NeoForge fills remaining keys on first save.

# Percentage of original GUI brightness to apply (lower = darker). Default 0.5.
texture_darkness = 0.353102992

# The minimum brightness value of font while dark mode is enabled.
# Default: 0.75 — Range: 0.0 ~ 1.0
font_brightness = 0.8043705985915491

# Algorithm selector for darkening interface pixels.
# Allowed Values: GRAYSCALE_AND_HSP, HSP, GRAYSCALE_AND_HSL, HSL, GRAYSCALE_AND_LINEAR, LINEAR
darkening_algorithm = "GRAYSCALE_AND_HSL"

# Full default path list (27 entries) + heart exclusion appended at the end
# ("!..." exclusions must come after the entries that would otherwise include
# them — "textures/gui/sprites/hud/*" is entry 10). Hearts stay bright so the
# health bar stays readable at the darker texture level.
paths = [
    "minecraft:textures/gui/advancements/window.png",
    "textures/gui/",
    "!minecraft:textures/gui/book.png",
    "textures/gui/container/*",
    "textures/gui/sprites/advancements/*",
    "textures/gui/sprites/boss_bar/*",
    "textures/gui/sprites/container/*",
    "textures/gui/sprites/dialog/*",
    "textures/gui/sprites/gamemode_switcher/*",
    "textures/gui/sprites/hud/*",
    "textures/gui/sprites/popup/*",
    "textures/gui/sprites/recipe_book/*",
    "textures/gui/sprites/social_interactions/*",
    "textures/gui/sprites/toast/*",
    "textures/gui/sprites/tooltip/*",
    "textures/gui/sprites/transferable_list/*",
    "textures/gui/sprites/widget/*",
    "textures/gui/sprites/world_list/*",
    "trinkets:textures/gui/slots/*",
    "craftingtweaks:gui.png",
    "dankstorage:textures/container/gui/*",
    "ae2:textures/guis/*",
    "!modmenu:textures/gui/mod_configuration.png",
    "!dynamiccrosshair:textures/gui/crosshairs.png",
    "quark:textures/misc/backpack_gui.png",
    "quark:textures/misc/matrix_enchanting.png",
    "quark:textures/misc/shulker_widget.png",
    "!minecraft:textures/gui/sprites/hud/heart/*",
]
