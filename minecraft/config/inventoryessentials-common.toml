# IE ships its own middle-click inventory sorting (modes: CONSOLIDATE_ONLY /
# RETAIN_ORDER / ALPHABETICAL / CREATIVE; default CREATIVE) which would
# duplicate ClientSort's reordering. Set to CONSOLIDATE_ONLY: middle-click
# only merges partial stacks, never reorders — ClientSort owns all sorting.
# All transfer features stay at defaults. NeoForge fills remaining keys on save.
