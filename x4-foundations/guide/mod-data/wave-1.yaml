- name: Learning All The Things
  url: https://www.nexusmods.com/x4foundations/mods/8
  category: utility
  description: >-
    Lets crew gain small amounts of experience passively over time instead of
    only through seminars and grinding, so pilots, managers and marines reach
    the 3-star thresholds for autonomous trading and mining at a sane pace.
  mechanics: >-
    Every 20 minutes each NPC has a configurable chance (default 30%) to gain 1
    skill point; NPCs don't learn while docked. Adjust chance/amount/job-fitting
    in learningallthethings.xml. Safe to add or remove mid-save.
- name: Sector Satellites
  url: https://www.nexusmods.com/x4foundations/mods/4
  category: utility
  description: >-
    A single satellite in a sector keeps trade prices and station information
    updated for all known non-hostile stations, removing the need to spam
    satellites everywhere — and is a welcome performance win.
- name: Apologise for Attack
  url: https://www.nexusmods.com/x4foundations/mods/381
  category: utility
  description: >-
    Lets you comm a ship or station that turned hostile after an accidental hit
    and apologise; if your reputation with the faction is good enough they
    forgive the transgression and drop hostility.
- name: Friendly Fire Tweaks
  url: https://www.nexusmods.com/x4foundations/mods/708
  category: utility
  description: >-
    Stops stray turret or AoE shots from instantly turning friendly factions
    hostile. Configurable conditions (victim being targeted, shield threshold,
    weapon type) must be met before retaliation penalties trigger.
- name: Mimic Repeat Orders
  url: https://www.nexusmods.com/x4foundations/mods/1774
  category: utility
  description: >-
    Lets subordinates copy their commander's Repeat Orders queue (trade and
    mining routes), automatically rescaling cargo amounts to each ship's
    capacity. Set a route up once and mirror it across a fleet.
  mechanics: >-
    Changes propagate to subordinates within ~30 seconds; supports one level of
    mimicry only; ships still need sufficient pilot skill to execute the copied
    orders.
  dependencies:
    - SirNukes' Mod Support APIs
- name: Mules, Supply and Warehouses Extended
  url: https://www.nexusmods.com/x4foundations/mods/416
  category: utility
  description: >-
    Adds four specialised trader AI scripts — Travel, Station, Supply and
    Distribution Mules — for automated logistics between your stations,
    warehouses and the open market.
  mechanics: >-
    Travel Mule sells at profit to NPC factions; Station Mule runs dedicated
    supply lines (and can set up warehouse stations); Supply Mule fetches
    resources to keep stations stocked; Distribution Mule balances cargo across
    your warehouse network.
