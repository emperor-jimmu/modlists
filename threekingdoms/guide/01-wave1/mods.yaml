  # MECHANICS
  #############################

  - name: "Better Diplomacy"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=1866034304"
    author: "kailash"
    version: "1.2.0"
    category: ["mechanics"]
    wave: 1
    description: "Fine-tunes AI diplomacy behavior for more predictable and sensible negotiations. AI makes offers that reflect actual needs, values alliance commitments more, and avoids nonsensical trade demands."
    dependencies: []
    conflicts: []
    mechanic_impact: "Adjusts AI negotiation weights and evaluation logic"
    adult: false
    notes: "No new campaign required. Safe mid-save."

  - name: "Relationships Matter"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2501505472"
    author: "kailash"
    version: "1.7.2"
    category: ["mechanics"]
    wave: 1
    description: "Enhances character friend/rival interactions with deeper relationship consequences. Friends provide stronger bonuses, rivalries escalate more dramatically, and Guanxi relationships feel impactful."
