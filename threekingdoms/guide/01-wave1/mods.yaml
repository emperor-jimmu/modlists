    dependencies: []
    conflicts: []
    mechanic_impact: null
    adult: false
    notes: "Purely audio/flavor. Compatible with all mods."

  - name: "Power and Politics"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2681138403"
    author: "kailash"
    version: "1.5.0"
    category: ["mechanics"]
    wave: 1
