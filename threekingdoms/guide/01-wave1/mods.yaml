  #############################
  # CONTENT / CHARACTERS
  #############################

  - name: "Make Them Unique 3.3"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=1812159400"
    author: "Wu Anguo"
    version: "3.3"
    category: ["content"]
    wave: 1
    description: "Adds unique 3D models, portrait art, and custom abilities to over 100 generic and historical characters. The definitive character uniqueness mod for Three Kingdoms."
    dependencies: []
    conflicts:
      - mod: "TUP (Total Unique Pack)"
        resolution: "Compatible — designed to work alongside TUP"
    mechanic_impact: "Gives unique battlefield abilities and passives to previously generic characters"
    adult: false
    notes: "Requires a new campaign for full effect. Extremely popular and well-maintained."

  - name: "MTU Characters Remodeled"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2025406762"
    author: "contactnovuspc"
    version: "1.3.0"
    category: ["content"]
    wave: 1
    description: "Enhanced high-detail 3D models for MTU characters. Replaces MTU models with higher-poly, better-textured versions while maintaining the same art style."
    dependencies: ["Make Them Unique 3.3"]
    conflicts: []
    mechanic_impact: null
    adult: false
    notes: "Load BEFORE Make Them Unique in load order (Remodeled at top, MTU below). Compatible with all MTU submods."

  - name: "MTU Event Add-on 1.0"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2428920358"
    author: "kailash"
    version: "1.0"
    category: ["content"]
    wave: 1
    description: "Adds custom narrative events and dilemmas for MTU characters. Gives unique story moments for heroes added by Make Them Unique."
    dependencies: ["Make Them Unique 3.3"]
    conflicts: []
    mechanic_impact: "Adds scripted events and dilemmas for unique characters"
    adult: false
    notes: "Recommended new campaign. Adds flavor and character-specific story beats."

