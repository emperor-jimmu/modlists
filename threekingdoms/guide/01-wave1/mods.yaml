    adult: false
    notes: "Requires new campaign. Significant gameplay depth addition."

  - name: "Han Character Hoarding Nerf"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=1791586648"
    author: "Scicotheron"
    version: "1.0.0"
    category: ["mechanics"]
    wave: 1
    description: "Removes the Han Empire's bonuses to character satisfaction and salary. Enables spying on the Han. Prevents the Han from hoarding every character in the mid-game."
    dependencies: []
    conflicts: []
    mechanic_impact: "Reduces Han Empire satisfaction bonuses, enables player to compete for characters"
    adult: false
    notes: "Improves campaign pacing. Prevents Han Empire from becoming an unassailable character magnet."
