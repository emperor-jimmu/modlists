    conflicts: []
    mechanic_impact: "Modifies character relationship satisfaction, loyalty, and event triggers"
    adult: false
    notes: "Works with MTU. V1.7.2 compatible."

  - name: "Battlefield Conversations EXPANDED! [1.7.2]"
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2465977086"
    author: "kailash"
    version: "1.7.2"
    category: ["content"]
    wave: 1
